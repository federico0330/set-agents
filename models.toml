opencode = { "zen" = "openai/gpt-5.4" }

# Per-role OpenCode-lane tier tables (contract 004 / AC-06). These are the ONLY
# consumers of MODEL_TIERS: the tier table IS the declaration of the OpenCode-lane
# row per (role, tier); generate.py's build-time coherence gate requires every
# declared model here to project to EXACTLY ONE routes.v1.toml row (openai-codex
# provider, matching tier, role-compatible) — see models_config.load_role_tiers.
# The three lanes carry the same model on purpose: only the openai-codex family
# projects from the OpenCode namespace, so lane variance would only ever produce
# a coherence-gate failure, not a real choice.
