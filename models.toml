[areas.ops]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
# 015 repair, round 2 (user decision: fix the named [areas.ops] residual from AC-06(a)'s
# widened generic scan -- see docs/adr/0019-anthropic-dispatch-parity.md D8): go-zen was
# "openai/gpt-5.6-terra", an exact same-provider-and-same-model collision with
# [roles.<tiered-role>.tiers.frontier].opencode."go-zen" (also "openai/gpt-5.6-terra") across
# all six tiered-role ladders, letting a BASE (non-routed) ops area coincide with a
# DYNAMICALLY tiered frontier writer -- the same collision class already closed for
# [areas.audit] and [areas.judge] this session. Realigned to "openai/gpt-5.4-mini", matching
# this area's own zen/openai-only lanes AND its sibling operational areas ([areas.gate],
# [areas.release], [areas.memory], which share this area's claude/codex/codex_effort triplet
# and already used this exact go-zen value) -- collides with no
# [roles.<tiered-role>.tiers.*].opencode."go-zen" value on this tree (every tiered value is
# one of luna/sol/terra, never "gpt-5.4-mini").
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "openai/gpt-5.4-mini", "openai-only" = "openai/gpt-5.4-mini" }

[roles.agent-factory]
