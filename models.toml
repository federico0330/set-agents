# models.toml — model routing source of truth (subscriptions, areas, role overrides).
# Edit by hand or via ./setup-models.sh; the wizard rewrites this file
# deterministically and does not preserve standalone comments.
schema = 2

[subscriptions]
anthropic = true
ollama = false
openai = true
zen = true

[catalog]
claude = ["fable", "haiku", "opus", "sonnet"]
codex = ["gpt-5.4", "gpt-5.4-mini", "gpt-5.5", "gpt-5.6-luna", "gpt-5.6-sol", "gpt-5.6-terra"]
codex_effort = ["high", "low", "medium", "xhigh"]

[session]
opencode_small_model = { "go-zen" = "opencode/north-mini-code-free", "zen" = "opencode/north-mini-code-free", "local" = "opencode/north-mini-code-free" }

[permissions]
profile = "yolo"

[runtime]
primary = "opencode"
fallbacks = []

[orchestrator.pi]
model = "gpt-5.6"
effort = "medium"

[routing]
enabled_providers = ["openai-codex", "anthropic"]
xhigh_benchmarked = false
max_enabled = false
fallback_limit = 1
single_writer = true

[routing.sla.fast]
checkpoint_minutes = 18
cutoff_minutes = 20
ceiling_minutes = 30

[routing.budgets]
direct_spawns = 0
fast_spawns = 1
scoped_spawns = 4
feature_spawns_per_package = 12
incident_spawns = 2

[areas.coord]
claude = "fable"
codex = "gpt-5.6-terra"
codex_effort = "high"
opencode = { "go-zen" = "openai/gpt-5.6-fast", "zen" = "openai/gpt-5.4", "local" = "openai/gpt-5.4" }

[areas.analysis]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-fast", "zen" = "openai/gpt-5.4-mini", "local" = "openai/gpt-5.4" }

[areas.docs]
claude = "sonnet"
codex = "gpt-5.6-sol"
codex_effort = "high"
opencode = { "go-zen" = "openai/gpt-5.4-fast", "zen" = "opencode/glm-5.2", "local" = "openai/gpt-5.5" }

[areas.implement]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "medium"
opencode = { "go-zen" = "openai/gpt-5.6-fast", "zen" = "opencode/kimi-k2.7-code", "local" = "openai/gpt-5.4" }

[areas.gate]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }

[areas.audit]
claude = "opus"
codex = "gpt-5.6-sol"
codex_effort = "xhigh"
opencode = { "go-zen" = "openai/gpt-5.6-sol", "zen" = "openai/gpt-5.5", "local" = "openai/gpt-5.5" }

[areas.judge]
claude = "opus"
codex = "gpt-5.6-sol"
codex_effort = "xhigh"
opencode = { "go-zen" = "openai/gpt-5.6-sol", "zen" = "openai/gpt-5.5", "local" = "openai/gpt-5.5" }

[areas.release]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }

[areas.memory]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }

[areas.ops]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.6-terra", "zen" = "openai/gpt-5.4-mini", "local" = "openai/gpt-5.4-mini" }

[roles.agent-factory]
claude = "opus"
codex_effort = "xhigh"

[roles.app-runner]
opencode = { "go-zen" = "opencode/deepseek-v4-flash-free", "zen" = "opencode/deepseek-v4-flash-free" }

[roles.architect]
claude = "opus"
codex_effort = "xhigh"

[roles.brainstormer]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "medium"
opencode = { "go-zen" = "opencode/nemotron-3-ultra-free", "zen" = "opencode/nemotron-3-ultra-free" }

[roles.debugger]
codex_effort = "high"
opencode = { "zen" = "openai/gpt-5.4" }

# Per-role OpenCode-lane tier tables (contract 004 / AC-06). These are the ONLY
# consumers of MODEL_TIERS: the tier table IS the declaration of the OpenCode-lane
# row per (role, tier); generate.py's build-time coherence gate requires every
# declared model here to project to EXACTLY ONE routes.v1.toml row (openai-codex
# provider, matching tier, role-compatible) — see models_config.load_role_tiers.
# The three lanes carry the same model on purpose: only the openai-codex family
# projects from the OpenCode namespace, so lane variance would only ever produce
# a coherence-gate failure, not a real choice.
[roles.debugger.tiers.fast]
opencode = { "go-zen" = "openai/gpt-5.6-luna", "zen" = "openai/gpt-5.6-luna", "local" = "openai/gpt-5.6-luna" }

[roles.debugger.tiers.balanced]
opencode = { "go-zen" = "openai/gpt-5.6-sol", "zen" = "openai/gpt-5.6-sol", "local" = "openai/gpt-5.6-sol" }

[roles.debugger.tiers.frontier]
opencode = { "go-zen" = "openai/gpt-5.6-terra", "zen" = "openai/gpt-5.6-terra", "local" = "openai/gpt-5.6-terra" }

[roles.delta-reviewer.tiers.fast]
opencode = { "go-zen" = "openai/gpt-5.6-luna", "zen" = "openai/gpt-5.6-luna", "local" = "openai/gpt-5.6-luna" }

[roles.delta-reviewer.tiers.balanced]
opencode = { "go-zen" = "openai/gpt-5.6-sol", "zen" = "openai/gpt-5.6-sol", "local" = "openai/gpt-5.6-sol" }

[roles.delta-reviewer.tiers.frontier]
opencode = { "go-zen" = "openai/gpt-5.6-terra", "zen" = "openai/gpt-5.6-terra", "local" = "openai/gpt-5.6-terra" }

[roles.finding-verifier.tiers.fast]
