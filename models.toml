# models.toml — model routing source of truth (subscriptions, areas, role overrides).
# Edit by hand or via ./setup-models.sh; the wizard rewrites this file
# deterministically and does not preserve standalone comments.
schema = 1

[subscriptions]
anthropic = true
ollama = false
openai = true
zen = true

[catalog]
claude = ["fable", "haiku", "opus", "sonnet"]
codex = ["gpt-5.4", "gpt-5.4-mini", "gpt-5.5", "gpt-5.6-luna", "gpt-5.6-sol", "gpt-5.6-terra"]
codex_effort = ["high", "low", "medium", "xhigh"]

[session]
opencode_small_model = { "go-zen" = "opencode/north-mini-code-free", "zen" = "opencode/north-mini-code-free", "local" = "opencode/north-mini-code-free" }

[permissions]
profile = "yolo"

[areas.coord]
claude = "fable"
codex = "gpt-5.6-terra"
codex_effort = "high"
opencode = { "go-zen" = "anthropic/claude-opus-4-8", "zen" = "openai/gpt-5.4", "local" = "openai/gpt-5.4" }

[areas.analysis]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "anthropic/claude-sonnet-5", "zen" = "openai/gpt-5.4-mini", "local" = "openai/gpt-5.4" }

[areas.docs]
claude = "sonnet"
codex = "gpt-5.6-sol"
codex_effort = "high"
opencode = { "go-zen" = "anthropic/claude-haiku-4-5", "zen" = "opencode/glm-5.2", "local" = "openai/gpt-5.5" }

[areas.implement]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "medium"
opencode = { "go-zen" = "anthropic/claude-sonnet-5", "zen" = "opencode/kimi-k2.7-code", "local" = "openai/gpt-5.4" }

[areas.gate]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }

[areas.audit]
claude = "opus"
codex = "gpt-5.6-sol"
codex_effort = "xhigh"
opencode = { "go-zen" = "openai/gpt-5.6-sol", "zen" = "openai/gpt-5.5", "local" = "openai/gpt-5.5" }

[areas.judge]
claude = "opus"
codex = "gpt-5.6-sol"
codex_effort = "xhigh"
opencode = { "go-zen" = "openai/gpt-5.6-sol", "zen" = "openai/gpt-5.5", "local" = "openai/gpt-5.5" }

[areas.release]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }

[areas.memory]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.4-mini", "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }

[areas.ops]
claude = "haiku"
codex = "gpt-5.6-luna"
codex_effort = "low"
opencode = { "go-zen" = "openai/gpt-5.6-terra", "zen" = "openai/gpt-5.4-mini", "local" = "openai/gpt-5.4-mini" }

[roles.agent-factory]
claude = "opus"
codex_effort = "xhigh"

[roles.app-runner]
opencode = { "go-zen" = "opencode/deepseek-v4-flash-free", "zen" = "opencode/deepseek-v4-flash-free" }

[roles.architect]
claude = "opus"
codex_effort = "xhigh"

[roles.brainstormer]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "medium"
opencode = { "go-zen" = "opencode/nemotron-3-ultra-free", "zen" = "opencode/nemotron-3-ultra-free" }

[roles.debugger]
codex_effort = "high"
opencode = { "zen" = "openai/gpt-5.4" }

[roles.frontend-engineer]
opencode = { "go-zen" = "openai/gpt-5.3-codex-spark", "local" = "openai/gpt-5.4-mini" }

[roles.image-describer]
opencode = { "local" = "openai/gpt-5.4-mini" }

[roles.local-gate-runner]
opencode = { "go-zen" = "opencode/deepseek-v4-flash-free" }

[roles.package-planner]
codex = "gpt-5.6-terra"

[roles.product-analyst]
codex = "gpt-5.6-terra"
opencode = { "zen" = "opencode/deepseek-v4-pro", "local" = "openai/gpt-5.4" }

[roles.project-bootstrapper]
codex = "gpt-5.6-luna"
codex_effort = "medium"
opencode = { "zen" = "opencode/deepseek-v4-pro", "local" = "openai/gpt-5.4-mini" }

[roles.refactor-specialist]
codex = "gpt-5.6-luna"
opencode = { "go-zen" = "openai/gpt-5.3-codex-spark", "local" = "openai/gpt-5.4-mini" }

[roles.runtime-verifier]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "medium"

[roles.test-writer]
opencode = { "zen" = "opencode/deepseek-v4-flash-free", "local" = "openai/gpt-5.4-mini" }
