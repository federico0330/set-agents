# tools.toml — optional tools catalog for ./set-agents (data only: adding a
# tool or an MCP server is a new block here, never code).
#
# [cli.<name>]  detect = binary to probe; install.<method> = exact command.
# Methods tried in order: platform package manager (pacman/apt/brew), npm, curl.
# `doc` is the fallback URL when no method applies. sudo commands always show
# the exact line and ask, even under --yes.
#
# [mcp.<name>]  type local (command) or remote (url); added DISABLED where the
# harness supports it, per the repo MCP policy.

[cli.supabase]
detect = "supabase"
# npm global install is blocked by the package's own postinstall — brew or binary only.
[cli.supabase.install]
brew = "brew install supabase/tap/supabase"
doc = "https://supabase.com/docs/guides/local-development/cli/getting-started"

[cli.vercel]
detect = "vercel"
[cli.vercel.install]
npm = "npm install -g vercel"
doc = "https://vercel.com/docs/cli"

[cli.gcloud]
detect = "gcloud"
[cli.gcloud.install]
curl = "curl -sSL https://sdk.cloud.google.com | bash"
doc = "https://cloud.google.com/sdk/docs/install"

[cli.gh]
detect = "gh"
[cli.gh.install]
pacman = "sudo pacman -S --needed --noconfirm github-cli"
apt = "sudo apt-get install -y gh"
brew = "brew install gh"
doc = "https://cli.github.com"

[cli.docker]
detect = "docker"
note = "después de instalar: sudo systemctl enable --now docker && sudo usermod -aG docker $USER (ojo: el grupo docker equivale a root). En WSL requiere systemd ([boot] systemd=true en /etc/wsl.conf + wsl --shutdown) o usar Docker Desktop de Windows."
[cli.docker.install]
pacman = "sudo pacman -S --needed --noconfirm docker"
apt = "sudo apt-get install -y docker.io"
brew = "brew install --cask docker"
doc = "https://docs.docker.com/engine/install/"

[cli.jq]
detect = "jq"
note = "requerido por ai/scripts/mcp.sh"
[cli.jq.install]
pacman = "sudo pacman -S --needed --noconfirm jq"
apt = "sudo apt-get install -y jq"
brew = "brew install jq"
doc = "https://jqlang.org"

[cli.obsidian]
detect = "obsidian"
note = "abrí ~/tu-empresa/obsidian como vault: ahí viven las notas de la documentación viva"
[cli.obsidian.install]
pacman = "sudo pacman -S --needed --noconfirm obsidian"
brew = "brew install --cask obsidian"
doc = "https://obsidian.md/download"

[cli.syncthing]
detect = "syncthing"
note = "sincroniza el vault Obsidian entre tus máquinas (P2P, sin nube). Habilitá con: systemctl --user enable --now syncthing — GUI en http://localhost:8384. NO sincronices repos git, solo el vault."
[cli.syncthing.install]
pacman = "sudo pacman -S --needed --noconfirm syncthing"
apt = "sudo apt-get install -y syncthing"
brew = "brew install syncthing"
doc = "https://syncthing.net"

[mcp.supabase]
type = "local"
command = ["npx", "-y", "@supabase/mcp-server-supabase@latest"]
note = "requiere SUPABASE_ACCESS_TOKEN en el entorno"

[mcp.context7]
type = "remote"
url = "https://mcp.context7.com/mcp"

[mcp.playwright]
type = "local"
command = ["npx", "-y", "@playwright/mcp@latest"]
