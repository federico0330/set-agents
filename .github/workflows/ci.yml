name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # legacy-prompt detection walks git history
      - name: verify.sh (full gate)
        run: ./ai/scripts/verify.sh

  # Real macOS: validates the BSD/bash-3.2 portability fixes on every push.
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # legacy-prompt detection walks git history
      - name: verify.sh (full gate)
        run: ./ai/scripts/verify.sh

  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Parse install.ps1
        shell: pwsh
        run: $null = [ScriptBlock]::Create((Get-Content -Raw install.ps1))
      - name: install.ps1 -DryRun
        shell: pwsh
        run: ./install.ps1 -DryRun
      - name: Compile python scripts
        shell: pwsh
        run: python -m py_compile (Get-ChildItem ai/scripts/*.py).FullName
      # AC-11 (005-P2/DEC-7): machine-verified tier stops being parse-only. This proves the
      # SELECTION logic (platform_pm/pick_method, path resolution, JSON envelopes) works on real
      # Windows Python — it does not prove Obsidian's GUI actually installs (DEC-7's manual tier).
      # Native Windows is a BOOTSTRAP target, not a runtime one: README.md:107 declares
      # the Windows path as install.ps1 -> managed WSL, so the harness itself runs on
      # Linux there and `verify-linux` is the gate that covers it. The tests that shell
      # out to the POSIX toolchain (bash + python3: set-agents, build.sh, install.sh)
      # skip here with the reason named -- see tests/__init__.py -- instead of failing
      # as if they had found a defect. What stays proven is the platform-independent
      # core plus the bootstrap above.
      # TEMPORARY (2026-08-18): the suite still fails here and the tests swallow the
      # child's stderr behind check=True, so the actual reason is invisible in the log.
      # This prints it once. Remove it as soon as the cause is fixed.
      - name: Diagnose the POSIX toolchain
        shell: bash
        continue-on-error: true
        run: |
          echo "--- which ---";   which bash python3 python || true
          echo "--- versions ---"; bash --version | head -1; python3 -V || true
          echo "--- pwd as bash sees it ---"; pwd
          echo "--- can python3 stat that pwd? ---"
          python3 -c "import os,sys; print('isdir', os.path.isdir(sys.argv[1]))" "$(pwd)" || true
          echo "--- set-agents --status ---"
          bash set-agents --status; echo "exit=$?"
          echo "--- build.sh --check ---"
          bash ./build.sh --check 2>&1 | tail -20; echo "exit=${PIPESTATUS[0]}"

      - name: Full unittest suite
        shell: pwsh
        env:
          # The env-var form, not `-X utf8`: the flag applies to THIS interpreter only,
          # while the tests spawn feature-state.py and friends as children. Production
          # code now declares encoding="utf-8" at every text read and write, so this is
          # a second line of defence rather than the mechanism.
          PYTHONUTF8: "1"
        run: python -X utf8 -m unittest discover -s tests -v
