name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # legacy-prompt detection walks git history
      - name: verify.sh (full gate)
        run: ./ai/scripts/verify.sh

  # Real macOS: validates the BSD/bash-3.2 portability fixes on every push.
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # legacy-prompt detection walks git history
      - name: verify.sh (full gate)
        run: ./ai/scripts/verify.sh

  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Parse install.ps1
        shell: pwsh
        run: $null = [ScriptBlock]::Create((Get-Content -Raw install.ps1))
      - name: install.ps1 -DryRun
        shell: pwsh
        run: ./install.ps1 -DryRun
      - name: Compile python scripts
        shell: pwsh
        run: python -m py_compile (Get-ChildItem ai/scripts/*.py).FullName
      # AC-11 (005-P2/DEC-7): machine-verified tier stops being parse-only. This proves the
      # SELECTION logic (platform_pm/pick_method, path resolution, JSON envelopes) works on real
      # Windows Python — it does not prove Obsidian's GUI actually installs (DEC-7's manual tier).
      # Native Windows is a BOOTSTRAP target, not a runtime one: README.md:107 declares
      # the Windows path as install.ps1 -> managed WSL, so the harness itself runs on
      # Linux there and `verify-linux` is the gate that covers it. The tests that shell
      # out to the POSIX toolchain skip here with the reason named -- see
      # tests/__init__.py -- instead of failing as if they had found a defect. The
      # capability they need is narrow and was measured, not guessed (run 32144718950):
      # bash and python3 both exist on this runner, but CreateProcess has no shebang
      # handling, so `subprocess.run([".../check-drift.sh"])` raises WinError 193. What stays proven is the platform-independent
      # core plus the bootstrap above.
      - name: Full unittest suite
        shell: pwsh
        env:
          # The env-var form, not `-X utf8`: the flag applies to THIS interpreter only,
          # while the tests spawn feature-state.py and friends as children. Production
          # code now declares encoding="utf-8" at every text read and write, so this is
          # a second line of defence rather than the mechanism.
          PYTHONUTF8: "1"
          # AC-4.3: 669 skipped of 1326 measured 2026-08-19 on windows-latest
          # (run 32208044413: OK skipped=669, suite exit 0). The 660 ceiling was the
          # 2026-08-18 654 skips plus PKG-4 posix-toolchain skips; PKG-5..6 added
          # more declared skips. A commit that adds skips must bump this number.
          WINDOWS_BOOTSTRAP_SKIP_CEILING: "669"
        run: |
          python -X utf8 -m unittest discover -s tests -v *> windows-unittest.log
          $code = $LASTEXITCODE
          Get-Content windows-unittest.log
          $ceiling = [int]$env:WINDOWS_BOOTSTRAP_SKIP_CEILING
          $log = Get-Content -Raw windows-unittest.log
          if ($log -match 'skipped=(\d+)') { $skips = [int]$Matches[1] }
          elseif ($log -match '(?m)^OK$') { $skips = 0 }
          else { Write-Error "could not parse skip count from unittest output"; exit 1 }
          Write-Host "WINDOWS_BOOTSTRAP_SKIPS=$skips ceiling=$ceiling"
          if ($skips -gt $ceiling) {
            Write-Error "skip count $skips exceeds ceiling $ceiling; bump WINDOWS_BOOTSTRAP_SKIP_CEILING in .github/workflows/ci.yml if the new skips are declared"
            exit 1
          }
          if ($code -ne 0) { exit $code }
