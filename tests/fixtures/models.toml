# models.toml — model routing source of truth (subscriptions, areas, role overrides).
# Edit by hand or via ./setup-models.sh; the wizard rewrites this file
# deterministically and does not preserve standalone comments.
schema = 1

[subscriptions]
anthropic = true
ollama = false
openai = true
zen = true

[catalog]
claude = ["haiku", "opus", "sonnet"]
codex = ["gpt-5.4", "gpt-5.4-mini", "gpt-5.6-sol", "gpt-5.6-terra"]
codex_effort = ["high", "low", "medium", "xhigh"]

[session]
opencode_small_model = "opencode/small-free"

[areas.coord]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "high"
opencode = "openai/gpt-5.6-terra"

[areas.implement]
claude = "sonnet"
codex = "gpt-5.6-terra"
codex_effort = "medium"
opencode = "openai/gpt-5.6-terra"

[areas.judge]
claude = "opus"
codex = "gpt-5.6-sol"
codex_effort = "xhigh"
opencode = "openai/gpt-5.6-sol"

[roles.debugger]
codex_effort = "high"
